name: Phase 0R and Phase 2B Passive Observers

on:
  push:
  pull_request:

jobs:
  phase0r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "xau-usd/xauusd-phase0r[dev]"

      - name: Run Phase 0R tests
        env:
          PYTHONPATH: xau-usd/xauusd-phase0r/src
        run: pytest xau-usd/xauusd-phase0r/tests

      - name: Run Phase 2B observer tests
        run: pytest xau-usd/xauusd-phase2b-passive-observers/tests

      - name: Run Phase 2B observer safety audit
        run: python xau-usd/xauusd-phase2b-passive-observers/scripts/audit_phase2b_observer_safety.py
