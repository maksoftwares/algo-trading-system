name: V23 Sealed Dukascopy Acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - codex/xau-independent-specialists-v1
    paths:
      - .github/workflows/v23_sealed_dukascopy_acquisition.yml

permissions:
  contents: read

jobs:
  acquire-sealed-confirmation-data:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Enforce byte-stable checkout
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Check out locked research package
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked package dependencies
        run: >-
          python -m pip install
          -r xau-usd/xauusd-fast-research/capital-dukas-lagged-economic-test-v23/requirements.txt

      - name: Acquire free sealed Dukascopy confirmation data
        run: >-
          python
          xau-usd/xauusd-fast-research/capital-dukas-lagged-economic-test-v23/download_sealed_dukascopy.py

      - name: Package raw data and signed source manifest
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "v23-sealed"
          $raw = "C:\DukascopyTickDataFoundationV1\raw\XAUUSD\year=2026\month=07"
          $manifest = "xau-usd\xauusd-fast-research\capital-dukas-lagged-economic-test-v23\outputs\CROSSVENUE_V23_DUKAS_SOURCE_MANIFEST.json"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $raw -Destination $stage -Recurse
          Copy-Item -LiteralPath $manifest -Destination $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $env:RUNNER_TEMP "v23-sealed.zip")

      - name: Upload sealed acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: v23-sealed-dukascopy
          path: ${{ runner.temp }}\v23-sealed.zip
          if-no-files-found: error
          retention-days: 7
